name: Post judged alarms

# The Haiku judge pushes one file per verdict to the "verdicts" branch. GitHub runs this workflow from
# that branch's copy, so it only checks out main and runs post.sh there: change post.sh, not this file.
on:
  push:
    branches: [verdicts]

permissions:
  contents: read

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: bash post.sh | tee -a "$GITHUB_STEP_SUMMARY"
