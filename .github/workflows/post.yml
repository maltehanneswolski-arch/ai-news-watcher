name: Post judged alarms

# The Haiku judge (a Claude routine) pushes one file per verdict to the "verdicts" branch; this posts the
# important ones among the files that push added. Files changed later are not posted again.
on:
  push:
    branches: [verdicts]

permissions:
  contents: read

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          git fetch -q --depth=50 origin state verdicts
          git show origin/state:state.json > state.json
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- verdicts/)
          else
            files=$(git ls-tree --name-only "$AFTER" verdicts/)
          fi
          mkdir -p new
          for f in $files; do git show "$AFTER:$f" > "new/$(basename "$f")"; done
          if [ -z "$files" ]; then echo "No new verdicts."; exit 0; fi
          python post_verdicts.py state.json new/*.json | tee -a "$GITHUB_STEP_SUMMARY"
